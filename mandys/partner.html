<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>masonre · Mandy's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--teal:#004540;--teal-lt:#0F9187;--gray:#1A1A19;--hair:#D9DED9;--muted:#6E7370;--wash:#F4F7F6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Work Sans",system-ui,sans-serif;background:var(--wash);color:var(--gray);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate{background:#fff;border-top:3px solid var(--teal);box-shadow:0 18px 50px rgba(0,0,0,.12);
    max-width:400px;width:100%;padding:40px 38px 34px;text-align:center}
  .eyebrow{color:var(--teal-lt);font-size:11px;font-weight:600;letter-spacing:.04em}
  h1{font-weight:300;font-size:26px;color:var(--teal);margin:10px 0 4px}
  p.hint{font-size:12.5px;color:var(--muted);margin-bottom:22px}
  input{width:100%;padding:12px 14px;font:inherit;font-size:15px;border:1px solid var(--hair);
    outline:none;text-align:center;letter-spacing:.08em}
  input:focus{border-color:var(--teal-lt)}
  button{width:100%;margin-top:12px;padding:12px;font:inherit;font-size:13px;font-weight:600;
    letter-spacing:.06em;background:var(--teal);color:#fff;border:none;cursor:pointer}
  button:hover{background:var(--teal-lt)}
  button:disabled{background:var(--muted);cursor:wait}
  .err{color:#A33;font-size:12.5px;margin-top:12px;min-height:18px}
  .wordmark{margin-top:26px;font-weight:700;font-size:13px;color:var(--teal)}
  @media (max-width:700px){
    body{padding:16px}
    .gate{padding:28px 20px 24px}
    input{font-size:16px}
    button{min-height:44px}
  }
</style>
</head>
<body>
<form class="gate" id="gate">
  <span class="eyebrow">Private · For the Mandy’s team</span>
  <h1>Mandy’s × masonre</h1>
  <p class="hint">Enter the password from the masonre team.</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
  <button type="submit" id="go">Open</button>
  <div class="err" id="err"></div>
  <div class="wordmark">masonre</div>
</form>

  const node = doc.getElementById("asset-manifest");
  if(!node) return;
  const assets = JSON.parse(node.textContent);
  async function decryptAsset(id){
    const meta = assets.find(a => a.id === id);
    if(!meta) throw new Error("missing asset");
    const {aesKey, macKey} = await keysFromPassword(pw);
    const res = await fetch(meta.file);
    if(!res.ok) throw new Error("missing file");
    const bytes = await decryptBytes(aesKey, macKey, meta.iv, meta.tag, new Uint8Array(await res.arrayBuffer()));
    return {meta, blob: new Blob([bytes], {type: meta.mime})};
  }
  function showPdf(url, meta){
    const overlay = doc.createElement("div");
    overlay.className = "pdf-overlay";
    overlay.innerHTML = '<div class="pdf-bar"><strong></strong><span><button type="button" data-dl>Download</button> <button type="button" data-x>Close</button></span></div><iframe title="PDF"></iframe>';
    overlay.querySelector("strong").textContent = meta.label;
    overlay.querySelector("iframe").src = url;
    overlay.querySelector("[data-x]").addEventListener("click", () => { overlay.remove(); URL.revokeObjectURL(url); });
    overlay.querySelector("[data-dl]").addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = url; a.download = meta.download;
      document.body.appendChild(a); a.click(); a.remove();
    });
    doc.body.appendChild(overlay);
  }
  async function openAsset(id, btn){
    btn.disabled = true;
    try{
      const {meta, blob} = await decryptAsset(id);
      showPdf(URL.createObjectURL(blob), meta);
    }catch(e){
      alert("Could not open that file. Try the password page again.");
    }
    btn.disabled = false;
  }
  async function downloadAsset(id, btn){
    btn.disabled = true;
    try{
      const {meta, blob} = await decryptAsset(id);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = meta.download;
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){
      alert("Could not download that file. Try the password page again.");
    }
    btn.disabled = false;
  }
  doc.querySelectorAll("[data-open]").forEach(btn => {
    btn.addEventListener("click", () => openAsset(btn.getAttribute("data-open"), btn));
  });
  doc.querySelectorAll("[data-download]").forEach(btn => {
    btn.addEventListener("click", () => downloadAsset(btn.getAttribute("data-download"), btn));
  });
}
async function attempt(pw, silent){
  const btn = document.getElementById("go"), err = document.getElementById("err");
  if(btn) btn.disabled = true;
  if(err) err.textContent = "";
  try{
    const html = await decrypt(pw);
    try{ sessionStorage.setItem("mandys-partner-pw", pw); }catch(e){}
    const frame = document.createElement("iframe");
    frame.title = "Mandy's x masonre";
    frame.setAttribute("style", "position:fixed;inset:0;border:0;width:100%;height:100%;background:#fff;z-index:20");
    let wired = false;
    frame.addEventListener("load", () => {
      if(wired) return;
      const doc = frame.contentDocument;
      if(!doc || !doc.getElementById("asset-manifest")) return;
      wired = true;
      wireFiles(pw, doc);
    });
    document.body.appendChild(frame);
    frame.srcdoc = html;
  }catch(e){
    if(btn) btn.disabled = false;
    if(!silent && err) err.textContent = "That's not it — try again.";
  }
}
document.getElementById("gate").addEventListener("submit", e => {
  e.preventDefault();
  attempt(document.getElementById("pw").value, false);
});
try{
  const saved = sessionStorage.getItem("mandys-partner-pw");
  if(saved) attempt(saved, true);
}catch(e){}
</script>
